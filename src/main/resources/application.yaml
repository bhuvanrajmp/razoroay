DB_URL: jdbc:postgresql://localhost:5432/razorpay
DB_USER: rpd
DB_PASS: rpd
spring:
  application:
    name: razoroay
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
